<!DOCTYPE html>
<html>
	<head>
		<meta charset = "utf-8">
		<meta http-equiv = "X-UA-Compatible" content = "IE=edge">
		<title> Navbar </title>
		<meta name = "description" content = "">
		<meta name = "viewport" content = "width = device-width, initial-scale = 1">
		<style>
			*{
			  box-sizing: border-box;
			  margin: 0;
			  padding: 0;
			  background-color: #fff
			}
			li, a, button{
			  font-family: "Montserrat", sans-serif;
			  font-weight: 500;
			  font-size: 16px;
			  color: #fff;
			  text-decoration: none;
			}
			header{
			  display: flex;
			  justify-content: flex-end;
			  align-items: center;
			  padding: 30px 10%;
			  background-color: #272459;
			  color: #fff
			}
			nav{
			  background-color: #272459;
			  color: #fff
			}
			.logo{
			  cursor: pointer;
			  margin-right: auto;
			  background-color: #272459;
			}
			.logo a{
			  cursor: pointer;
			  background-color: #272459;
			  margin-right: 200px;
			  font-weight: 800;
			  font-size: 20px;
			}
			.nav__links{
			  list-style: none;
			  background-color: #272459;
			}
			.nav__links li{
			  display: inline-block;
			  padding: 8px 20px;
			  background-color: #272459;
			}
			.nav__links li a{
			  transition: all 0.3s case 0s;
			  background-color: #272459;
			  font-size: 20px;
			  font-weight: 800;
			  margin-right: 90;
			}
			.nav__links li a:hover{
			  background-color: #8a6ff0;
			}
			button{
			  padding: 9px 25px;
			  background-color: rgb(0, 136, 169, 1);
			  border: none;
			  border-radius: 50px;
			  cursor: pointer;
			  transition: all 0.3s case 0s
			}
			button:hover{
			  background-color: rgb(0, 136, 169, 0.8);
			}
			
		</style>
	</head>
	<body>
		<header>
			<img class="logo" src = "logof.jpg" alt = "logo" width = 90px height = 90px>
			<div class="logo"><a href="#">Patitas a casa</a></div>
			<nav>
				<ul class="nav__links">
					<li><a href = "#">Principal</a></li>
					<li><a href = "#">About</a></li>
					<li><a href = "#">Blog</a></li>
					<li><a href = "#">Docs</a></li>
					<li><a href = "#">Iniciar reporte</a></li>
				</ul>
			</nav>
		</header>
		<p> Este es un parrafo de prueba </p>
	</body>
</html>
